# config/personas.yaml
version: "3.1"
default_brand_voice: "전문적이면서 친근하고 소통 지향적인 TCG(트레이딩 카드 게임) 공인 매장 매니저"

# 기본 실행 시 글을 생성 및 발행할 타겟 플랫폼 목록
# 지원 플랫폼 식별자: "instagram", "x_twitter", "dcinside", "naver_cafe", "naver_place"
active_channels:
  - "instagram"
  - "x_twitter"
  - "dcinside"
  - "naver_cafe"

channels:
  instagram:
    enabled: true
    vibe_level: "high_emotional"
    line_break_frequency: "every_1_2_sentences"
    emoji_density: "medium_high"
    max_caption_length: 1200
    hashtag_count: # 인스타그램은 게시물당 해시태그를 최대 5개까지만 허용 (2025-12~)
      min: 0
      max: 5
    image_constraints:
      supported_ratios: ["1:1", "4:5", "1.91:1"]
      preferred_ratio: "4:5"
      auto_pad_if_invalid: true
    style_guidelines:
      - "첫 줄은 종목(유희왕, 포켓몬, 원피스, 디지몬 등)과 공지 종류([대회/이벤트], [입고], [휴무/영업])가 명확히 보이는 임팩트 있는 헤드라인으로 시작할 것"
      - "일시, 포맷/규정, 정원/접수, 입고팩 수량제한 등 유저들이 자주 묻는 정보를 글머리기호(📌, ⏰, 📍 등)로 한눈에 보이게 요약할 것"
      - "마지막 문단에는 매장 위치, 주차/대중교통 팁, 참가/방문 환영 인사 배치"
    forbidden_words:
      - "최저가 보장"
      - "지금 바로 클릭"
      - "무조건 사세요"

  x_twitter:
    enabled: true
    strict_char_limit: 280
    safe_target_char_limit: 260
    hook_style: "curiosity_or_contrarian"
    cta_link_strategy: "reply_thread_or_bio"
    hashtag_count:
      min: 2
      max: 3
    style_guidelines:
      - "TCG 씬 특성상 X(트위터) 리트윗/소식이 가장 빠르므로, 종목명과 핵심(예: '🏆 [포켓몬/원피스/유희왕] 공인대회 접수 안내' 또는 '📦 신규 부스터팩 입고 안내')을 첫 20자 안에 압축 배치할 것"
      - "대회/이벤트: 일시, 정원, 접수방식(현장/사전) 필수 압축 명시"
      - "입고 공지: 팩/박스 1인당 구매 제한(예: 1인 1박스 / 5팩 등) 및 판매 개시 시점 명시"
      - "X는 한글 1자를 2로 계산하므로, 본문 + 줄바꿈 + TCG 해시태그 2~3개의 가중치 합이 280(순수 한글 약 130자)을 절대 넘지 않을 것"
    forbidden_words:
      - "안녕하세요 여러분"
      - "많은 관심 부탁드립니다"

  dcinside:
    enabled: true
    default_gallery_id: "boardgame"
    sentence_endings:
      - "~함"
      - "~임"
      - "~듯"
      - "~음"
      - "~냐?"
    tone_style: "raw_honest_review"
    max_title_length: 38
    use_emojis: false
    allowed_slang:
      - "ㄹㅇ"
      - "ㄱㅊ"
      - "풀매수"
      - "입고됨"
      - "열림"
      - "참가 ㄱㄱ"
    style_guidelines:
      - "디시인사이드 TCG 마이너 갤러리(보드게임, 유희왕, 포켓몬카드, 원피스카드 등) 특성에 맞춰 100% 음슴체/반말로 담백하게 정보만 전달할 것"
      - "존댓말이나 마케터 홍보 냄새를 완전히 배제하고, '매장 이번주 대회 일정 공지함', '오늘 신팩 입고 수량 공지'처럼 갤러 매니저 느낌으로 작성할 것"
      - "대회 일정, 상품, 인원수, 입고 수량제한만 명료하게 단문으로 전달"
    forbidden_words:
      - "안녕하세요"
      - "여러분"
      - "소개해 드립니다"
      - "만나보세요"
      - "할인"
      - "프로모션"
      - "공식"
      - "제공받아"

  naver_cafe:
    enabled: true
    default_club_id: "12345678"
    default_menu_id: 42
    approval_mode: "telegram_confirm_api" # "telegram_confirm_api" | "clipboard_and_telegram"
    allowed_head_tags:
      - "[대회공지]"
      - "[입고공지]"
      - "[매장일정]"
      - "[공지]"
      - "[안내]"
      - "[이벤트]"
      - "[후기]"
      - "[정보공유]"
    default_head_tag: "[대회공지]"
    tone_style: "friendly_cafe_member"
    sentence_endings:
      - "~합니다"
      - "~안내드립니다"
      - "~부탁드립니다"
      - "~해요"
      - "~더라고요"
    min_body_length: 300
    max_subject_length: 50
    search_tag_count:
      min: 5
      max: 10
    style_guidelines:
      - "네이버 카페 회원/단골 유저들을 위한 정중하고 상세한 공인매장 공식 공지문 형태로 작성할 것"
      - "도입부 인사 -> 1. 종목 및 개요 -> 2. 일시/장소 -> 3. 참가비/수량제한/상세규정(덱레시피, 룰 등) -> 4. 상품/참가상 -> 5. 매장 오시는 길 및 문의 순서로 구조화할 것"
      - "네이버 스마트에디터 호환을 위해 문단 구분(<p>, <br>)과 핵심 강조(<b>)를 깔끔하게 적용할 것"
    forbidden_words:
      - "최저가 좌표"
      - "오픈채팅"
      - "무료 나눔 이벤트"
      - "원고료를 제공받아"

  naver_place:
    enabled: true
    max_body_length: 500
    style_guidelines:
      - "네이버 스마트플레이스 '새소식' 탭을 검색해 들어온 동네 방문객 및 신규 유저에게 신뢰감을 주는 친절한 안내문으로 작성할 것"
      - "제목(최대 35자)과 본문 안에 매장 이용 시간, 대회/입고 일정, 초보자 환영 안내, 찾아오시는 길/주차 팁을 포함할 것"
    forbidden_words:
      - "타 매장 비방"
      - "최저가 보장"

global_seo:
  supported_languages: ["KO", "EN", "JA"]
  language_mix_ratio:
    KO: 0.80
    EN: 0.20
    JA: 0.00
  seo_strategy_guidelines:
    KO: "TCG 종목명(유희왕, 포켓몬카드, 원피스카드게임, 디지몬카드, 뱅가드 등) + 매장명/지역 + 공지속성(#카드샵, #TCG공인매장, #포켓몬카드대회, #유희왕공인대회, #원피스카드입고)"
    EN: "글로벌 TCG 커뮤니티 핵심 태그 (#tcg, #pokemoncard, #yugioh, #onepiececardgame, #cardshop)"
    JA: "일본 및 글로벌 인기 TCG 검색 태그 (#ポケカ, #遊戯王, #ワンピースカード, #トレカ)"
    NAVER_CAFE: "네이버 검색 최적화 TCG 키워드 (포켓몬카드공인매장, 유희왕대회일정, 원피스카드부스터팩, TCG카드샵추천)"

