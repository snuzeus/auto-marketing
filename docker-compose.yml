services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: social-auto-postiz
    restart: always
    env_file: [.env]
    environment:
      MAIN_URL: "http://localhost:5000"
      FRONTEND_URL: "http://localhost:4200"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:3000"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postiz}:${POSTGRES_PASSWORD:-postiz_secret}@postiz-postgres:5432/${POSTGRES_DB:-postiz}"
      REDIS_URL: "redis://postiz-redis:6379"
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
    ports: ["5000:5000", "4200:4200", "3000:3000"]
    volumes: [postiz-uploads:/uploads]
    depends_on:
      postiz-postgres: {condition: service_healthy}
      postiz-redis: {condition: service_healthy}

  postiz-postgres:
    image: postgres:16-alpine
    container_name: social-auto-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postiz_secret}
      POSTGRES_DB: ${POSTGRES_DB:-postiz}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postiz}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postiz-redis:
    image: redis:7.2-alpine
    container_name: social-auto-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  postiz-uploads:
